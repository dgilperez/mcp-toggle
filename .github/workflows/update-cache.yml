name: Update MCP Cache

on:
  # Run weekly on Sunday nights at 23:00 CET (22:00 UTC in winter, 21:00 UTC in summer)
  schedule:
    - cron: '0 22 * * 0'  # 22:00 UTC on Sundays

  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run cache generation
        run: |
          chmod +x scripts/generate-cache.sh
          ./scripts/generate-cache.sh

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Impact Measurements"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Current cache has been regenerated from registries."
          echo ""
          echo "To update with REAL token measurements:"
          echo "  1. Run locally: ./scripts/measure-impact.sh"
          echo "  2. Follow prompts to measure via Claude Code /context"
          echo "  3. Commit: git add data/mcp-cache.json"
          echo "  4. Push to update measurements for everyone"
          echo ""
          echo "Measurements change 'method: manual' → 'method: measured'"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/mcp-cache.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/mcp-cache.json
          git commit -m "chore: Update MCP cache (weekly automated update)

          - Refreshed server metadata from MCP registry
          - Updated npm stats (downloads, versions)
          - Regenerated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          💡 To update impact measurements, run locally:
             ./scripts/measure-impact.sh

          🤖 Automated by GitHub Actions"
          git push

      - name: Create measurement reminder issue
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if reminder issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'measurement-reminder'
            });

            if (issues.data.length === 0) {
              // Create reminder issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 Weekly Reminder: Update Impact Measurements',
                labels: ['measurement-reminder', 'enhancement'],
                body: `## Update Token Impact Measurements

The weekly cache refresh just ran. Consider updating impact measurements with real data from Claude Code.

### How to Measure

Run this locally on your machine (requires Claude Code installed):

\`\`\`bash
./scripts/measure-impact.sh
\`\`\`

This will:
1. Open Claude Code
2. Guide you through running \`/context\`
3. Update the cache with real token measurements
4. Change \`"method": "manual"\` → \`"method": "measured"\`

### Why Measure?

- Current ratings are estimates
- Real measurements help everyone understand actual impact
- Measurements vary by usage (filesystem: 100KB vs 10MB file)

### After Measuring

\`\`\`bash
git add data/mcp-cache.json
git commit -m "Update impact measurements with real data"
git push
\`\`\`

---
*This issue is auto-created weekly. Close it after updating measurements.*`
              });
            }
